
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | OutLay</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f6;
      color: #18332f;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px #18332f12;
    }

    h1 {
      margin-top: 0;
      font-size: 27px;
    }

    p {
      color: #647570;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d4dfdc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #087f6e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    a {
      color: #087f6e;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Enter your new password for your OutLay account.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter new password"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="Confirm new password"
        required
      >

      <button id="submitButton" type="submit">
        Update Password
      </button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="/">Back to OutLay</a></p>
  </main>

  <script>
    // Use the SAME project URL and publishable key as index.html.
    const SUPABASE_URL =
      ""https://zplwcrcvnsjgskhmaben.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_As35I7FLm_SQNmQtRKJ8zQ_VYovZ0DD";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    async function initializeResetPage() {
      const { data, error } = await client.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Your recovery session is missing or expired. Request a new password reset email.";
        form.hidden = true;
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        message.textContent =
          "Password must be at least 8 characters long.";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      message.textContent = "Updating password...";

      try {
        const { error } = await client.auth.updateUser({
          password: password
        });

        if (error) throw error;

        message.textContent =
          "Password updated successfully. You can now return to OutLay and log in.";

        form.hidden = true;
      } catch (error) {
        message.textContent =
          error.message +
          " Please request a fresh recovery email if needed.";
      } finally {
        button.disabled = false;
      }
    });

    initializeResetPage();
  </script>
</body>
</html>
